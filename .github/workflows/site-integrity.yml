name: Site integrity

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s script.js
          test -s archive.json
          test -s manifest.webmanifest
          test ! -e CNAME
      - name: Validate JSON
        run: |
          python -m json.tool archive.json >/dev/null
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Check GitHub Pages URL consistency
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://skdietrich.github.io/ghosts-in-the-code/"
          grep -Fq "$BASE" index.html
          grep -Fq "${BASE}sitemap.xml" robots.txt
          grep -Fq "$BASE" sitemap.xml
